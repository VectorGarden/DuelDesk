<!doctype html>
<meta charset="utf-8">
<!-- A tombstone, and a trap worth explaining.
     
     The page lives at winners/index.html and is linked as /winners/. This file
     exists only to catch links to the old /winners.html.
     
     It must point at /winners/ WITH the trailing slash. GitHub Pages resolves
     an extensionless /winners to winners.html -- this file -- before it looks
     at the directory, so a refresh aimed at /winners lands back here and the
     page redirects to itself forever. It shipped that way and the winners page
     was unusable in a browser; curl never saw it, because a meta refresh is
     the browser's job and the response was a perfectly ordinary 200. -->
<title>Winners — Duel Desk</title>
<link rel="canonical" href="https://dueldesk.reizu.dev/winners/">
<meta http-equiv="refresh" content="0; url=/winners/">
<p>This page has moved to <a href="/winners/">/winners/</a>.</p>
