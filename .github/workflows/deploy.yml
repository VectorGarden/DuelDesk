name: Deploy

# One definition of how the site reaches production, called both by the workflow
# that validates a code change and by the one that scrapes new coverage.
#
# It lived inside validate.yml until a scrape pushed a commit that deployed
# nothing. GitHub does not start workflows for pushes made with GITHUB_TOKEN --
# it is how recursive runs are prevented -- so "commit it and let the push
# deploy" quietly did half its job. Copying these steps into the scraper instead
# would leave two definitions of the deploy free to drift apart, and this
# repository has already had one silent deploy failure.
on:
  workflow_call:
    inputs:
      ref:
        description: >-
          What to deploy. The scraper passes main: its commit lands after its own
          run started, so the default checkout would build the tree from before.
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys queue rather than cancel each other; a half-published site is worse
    # than a slightly late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Only while the site is still serving the simulation. The sample data
      # carries the timestamps it was generated with and liveness is derived
      # from them, so an untouched demo stops showing its live state a few hours
      # after it was last built. Real coverage has real timestamps and must not
      # be overwritten, so this is skipped the moment the committed data says it
      # is not sample -- otherwise every code merge would quietly replace a
      # scraped event with the simulation.
      # Falls back to "not sample" when the field is missing, which is the safe
      # direction twice over: it does not regenerate over data that might be
      # real, and it leaves check-rounds.py below to reject the file with a
      # readable message rather than dying here on a KeyError.
      - id: provenance
        run: |
          echo "sample=$(python3 -c "
          import json
          events = json.load(open('events.json')).get('events') or []
          print('true' if events and all(e.get('sample') is True for e in events) else 'false')
          ")" >> "$GITHUB_OUTPUT"

      - if: steps.provenance.outputs.sample == 'true'
        name: Regenerate sample data with current timestamps
        # --out . explicitly: the generator now writes test fixtures by default,
        # and this step is the one place that still wants the served files. Left
        # implicit it would refresh the fixtures and deploy the stale archive.
        run: python3 scripts/generate-sample-data.py --out .

      # Whatever is about to be staged, check it here too: the regenerated files
      # are not the ones the validate job saw, and scraped data arrives from a
      # different workflow entirely. Nothing is published unverified.
      - name: Validate the data about to be published
        run: |
          python3 .github/scripts/check-feed.py feed.xml
          for f in events/*/rounds.json; do
            python3 .github/scripts/check-rounds.py "$f"
          done

      # An include list, so the artifact holds the site and not the repository.
      - name: Stage the site
        run: ./scripts/stage-site.sh _site

      # Proves the staging script did not forget a file the page references.
      # Cheaper to fail here than to 404 in production.
      - name: Verify the artifact is complete
        working-directory: _site
        run: python3 ../.github/scripts/check-references.py index.html winners.html winners/index.html player/index.html read/index.html

      # A rehearsal, against the artifact instead of the internet.
      #
      # The real smoke test runs only after deploy-pages, so a fault in the
      # script itself shows up as a red deploy of a site that is in fact fine --
      # which is how both #62 and #63 went red, over a URL the check was
      # building wrongly rather than a file that was missing. Running it here
      # first means a broken check is caught before it is relied on, and a file
      # the staging forgot never reaches production at all.
      #
      # It cannot replace the real one: nothing local can answer whether the
      # site is serving what was uploaded. Everything else it checks, it can.
      #
      # ATTEMPTS=1 because there is nothing to propagate -- a local server
      # either has the file or does not, and retrying ten times with sleeps
      # would only make a genuine failure slow.
      - name: Rehearse the smoke test against the artifact
        run: |
          python3 -m http.server 8137 --bind 127.0.0.1 --directory _site &
          trap 'kill %1 2>/dev/null || true' EXIT
          # Silent: the first probe or two land before the server has bound,
          # and a connection error printed there reads like a fault when it is
          # the loop doing its job.
          for _ in $(seq 1 40); do
            curl -fs -o /dev/null http://127.0.0.1:8137/index.html 2>/dev/null && break
            sleep 0.25
          done
          ATTEMPTS=1 ./scripts/smoke-test.sh "http://127.0.0.1:8137/" _site

      - uses: actions/configure-pages@v6
      # v4 stopped putting dotfiles in the artifact unless include-hidden-files
      # is set. stage-site.sh stages an explicit include list and none of it is
      # hidden, so nothing is lost here -- but a dotfile added to that list (a
      # .nojekyll, say) would need the input turned on to reach the site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

      # Closes the loop. Everything above proves the code is good and the
      # artifact was uploaded; only this proves the live site is serving it.
      # Deploys were silently broken for two merges once, with CI green
      # throughout, because nothing ever asked production a question.
      - name: Smoke test the deployed site
        run: ./scripts/smoke-test.sh "${{ steps.deployment.outputs.page_url }}" _site
