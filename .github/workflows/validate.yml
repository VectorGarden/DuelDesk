name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The sample data is regenerated at deploy time and its live window is six
  # hours, so redeploy every four. That leaves two hours of slack for the
  # scheduler, which runs late under load and is not a guarantee. Offset from
  # the hour for the same reason -- :00 is the busiest minute on the platform.
  schedule:
    - cron: '17 */4 * * *'
  # A manual "refresh now", which also deploys.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  # Superseding a PR run is fine; cancelling a run that is mid-deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Tests, HTML, inline scripts and data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'          # Nu Html Checker needs 11+

      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so CI and a local `nvm use` cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      # Both vnu-jar and the test harness are pinned in package-lock.json, so
      # CI installs exactly what was developed against.
      - name: Install dev dependencies
        run: npm ci

      # The JavaScript lives inside index.html, so it never reaches a bundler
      # or a linter. These run the page itself in jsdom against the real data.
      - name: Run tests
        run: npm test

      # Informational: unfiltered, so genuine CSS problems stay visible in the
      # log even though they do not gate. Expect stale CSS complaints here --
      # see the note on the gating step below.
      - name: HTML report (unfiltered, never fails)
        run: |
          JAR="$(node -p "String(require('vnu-jar'))")"
          java -jar "$JAR" --format gnu index.html || true

      # Gating, and deliberately HTML-only:
      #   * --errors-only, so a new warning cannot break an unrelated PR.
      #   * CSS messages filtered out. vnu bundles a CSS checker built on an old
      #     spec snapshot that rejects valid modern CSS -- color-mix(), and the
      #     independent transform properties translate/rotate. The hosted
      #     validator at validator.w3.org does not flag these. Filtering keeps
      #     this job honest about what it verifies: the HTML.
      - name: Validate HTML
        run: |
          JAR="$(node -p "String(require('vnu-jar'))")"
          java -jar "$JAR" \
            --errors-only \
            --filterpattern '(?s).*CSS: .*' \
            --format gnu index.html

      # An HTML validator treats <script> contents as opaque text, so a syntax
      # error in this single-file site would otherwise reach production.
      - name: Check inline scripts parse
        run: node .github/scripts/check-inline-js.mjs index.html

      # Python rather than xmllint: libxml2-utils is no longer present on the
      # ubuntu-latest runner image, and this checks feed structure, not just
      # well-formedness.
      - name: Validate feed.xml
        run: python3 .github/scripts/check-feed.py feed.xml

      # The blog scraper is Python and tested against saved fixtures, so it
      # runs offline -- the parser is the part worth guarding, not the fetch.
      - name: Run scraper tests
        run: python3 -m unittest discover -s scraper -p 'test_*.py' -v

      # The archive is fetched from JavaScript, so the reference check cannot
      # see it. This also verifies the records in it actually add up -- for
      # every event, not only the newest: a backfill writes several at a time,
      # and an older one built from patchier coverage is where a bad file would
      # come from.
      - name: Validate the archive
        run: |
          # One process for the whole archive. Called once a file it spent
          # about a quarter of its time starting Python rather than reading
          # anything, and the checker takes as many paths as it is given.
          python3 .github/scripts/check-rounds.py events/*/rounds.json

      # Two favicon failures are invisible everywhere else: a PNG-encoded ICO,
      # which Safari will not decode, and an oversized rel="icon".
      - name: Validate icons
        run: python3 .github/scripts/check-icons.py

      # Every local file the page references must actually be in the repo.
      - name: Check local references resolve
        run: python3 .github/scripts/check-references.py index.html winners.html winners/index.html

  deploy:
    name: Deploy to GitHub Pages
    needs: validate                     # never publish a build that failed its checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
