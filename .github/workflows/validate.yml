name: Validate

on:
  pull_request:
  push:
    branches: [main]
  # The sample data is regenerated at deploy time and its live window is six
  # hours, so redeploy every four. That leaves two hours of slack for the
  # scheduler, which runs late under load and is not a guarantee. Offset from
  # the hour for the same reason -- :00 is the busiest minute on the platform.
  schedule:
    - cron: '17 */4 * * *'
  # A manual "refresh now", which also deploys.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  # Superseding a PR run is fine; cancelling a run that is mid-deploy is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Tests, HTML, inline scripts and data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # Nu Html Checker needs 11+

      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc so CI and a local `nvm use` cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      # Both vnu-jar and the test harness are pinned in package-lock.json, so
      # CI installs exactly what was developed against.
      - name: Install dev dependencies
        run: npm ci

      # The JavaScript lives inside index.html, so it never reaches a bundler
      # or a linter. These run the page itself in jsdom against the real data.
      - name: Run tests
        run: npm test

      # Informational: unfiltered, so genuine CSS problems stay visible in the
      # log even though they do not gate. Expect stale CSS complaints here --
      # see the note on the gating step below.
      - name: HTML report (unfiltered, never fails)
        run: |
          JAR="$(node -p "String(require('vnu-jar'))")"
          java -jar "$JAR" --format gnu index.html || true

      # Gating, and deliberately HTML-only:
      #   * --errors-only, so a new warning cannot break an unrelated PR.
      #   * CSS messages filtered out. vnu bundles a CSS checker built on an old
      #     spec snapshot that rejects valid modern CSS -- color-mix(), and the
      #     independent transform properties translate/rotate. The hosted
      #     validator at validator.w3.org does not flag these. Filtering keeps
      #     this job honest about what it verifies: the HTML.
      - name: Validate HTML
        run: |
          JAR="$(node -p "String(require('vnu-jar'))")"
          java -jar "$JAR" \
            --errors-only \
            --filterpattern '(?s).*CSS: .*' \
            --format gnu index.html

      # An HTML validator treats <script> contents as opaque text, so a syntax
      # error in this single-file site would otherwise reach production.
      - name: Check inline scripts parse
        run: node .github/scripts/check-inline-js.mjs index.html

      # Python rather than xmllint: libxml2-utils is no longer present on the
      # ubuntu-latest runner image, and this checks feed structure, not just
      # well-formedness.
      - name: Validate feed.xml
        run: python3 .github/scripts/check-feed.py feed.xml

      # rounds.json is fetched from JavaScript, so the reference check cannot
      # see it. This also verifies the records in it actually add up.
      - name: Validate rounds.json
        run: python3 .github/scripts/check-rounds.py rounds.json

      # Two favicon failures are invisible everywhere else: a PNG-encoded ICO,
      # which Safari will not decode, and an oversized rel="icon".
      - name: Validate icons
        run: python3 .github/scripts/check-icons.py

      # Every local file the page references must actually be in the repo.
      - name: Check local references resolve
        run: python3 .github/scripts/check-references.py index.html

  deploy:
    name: Deploy to GitHub Pages
    needs: validate                     # never publish a build that failed its checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys queue rather than cancel each other; a half-published site is worse
    # than a slightly late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The committed feed and round data carry the timestamps they were
      # generated with, and liveness is derived: an event is only "live" while
      # the feed's own build time is recent. Left alone, the deployed demo stops
      # showing its live state a few hours after the data was last regenerated.
      #
      # The PRNG is seeded, so this reproduces the same tournament -- same
      # bracket, same records, same results. Only the clock moves.
      - name: Regenerate sample data with current timestamps
        run: python3 scripts/generate-sample-data.py

      # The regenerated files are not the ones the validate job checked, so
      # check them again. A generator fault would otherwise publish data that
      # nothing had verified.
      - name: Validate the regenerated data
        run: |
          python3 .github/scripts/check-feed.py feed.xml
          python3 .github/scripts/check-rounds.py rounds.json

      # An include list, so the artifact holds the site and not the repository.
      - name: Stage the site
        run: ./scripts/stage-site.sh _site

      # Proves the staging script did not forget a file the page references.
      # Cheaper to fail here than to 404 in production.
      - name: Verify the artifact is complete
        working-directory: _site
        run: python3 ../.github/scripts/check-references.py index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Closes the loop. Everything above proves the code is good and the
      # artifact was uploaded; only this proves the live site is serving it.
      # Deploys were silently broken for two merges once, with CI green
      # throughout, because nothing ever asked production a question.
      - name: Smoke test the deployed site
        run: ./scripts/smoke-test.sh "${{ steps.deployment.outputs.page_url }}" _site
