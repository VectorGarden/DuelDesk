name: Scrape coverage

# Every ten minutes, and almost every one of those stops immediately.
#
# Coverage lands in bursts: during a YCS a round finishes roughly every fifty
# minutes and brings pairings, standings and features with it, while between
# events nothing is posted for weeks. Hourly was far too slow for the first and
# more often than needed for the second.
#
# GitHub cannot compute a cron at runtime, so the schedule is fixed at the fast
# rate and scraper/cadence.py drops the ticks that are not wanted. That decision
# reads the clock and the previous run's state and makes no network request, so
# a dropped tick costs a few seconds of runner time and nothing of the blog's.
# Over a quiet day it is one check an hour, as before; over a day of coverage it
# is every ten minutes.
#
# What this finds IS published. It commits feed.xml and the events/ archive with
# its manifest, and that push runs Validate, which checks them again and deploys.
#
# Committing rather than deploying straight from here is what keeps the site
# coherent: the repository is the one source of what is served, so a later code
# merge redeploys the same coverage instead of reverting the site to the
# simulation. It also leaves a history of what was published and when, which an
# artifact that expires in 14 days does not.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Scrape even if the sitemap has not moved (implied by a backfill)'
        type: boolean
        default: false
      backfill:
        # A few at a time, on purpose. At one request a second an event is a
        # couple of minutes and the whole archive is hours, and the events are
        # finished -- there is no reason to take them all in one run.
        description: 'Also build this many older events missing from the archive'
        type: string
        default: '0'
      rebuild:
        # The other direction: events already here, written by a builder that
        # has since been corrected. Costs the same as building them the first
        # time, so it is asked for in the same small numbers.
        description: 'Also rebuild this many events an older builder wrote'
        type: string
        default: '0'

permissions:
  contents: write        # commits the coverage it scrapes; see "Publish" below

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Check for new coverage
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      # The high-water mark and the timings from the previous run. Cached rather
      # than committed: a scraper should not need write access to the repository.
      # Restore and save are separate so a dropped tick, which changes nothing,
      # does not write a cache entry -- at six ticks an hour that would be a few
      # hundred entries a day evicting everything else in the repository's cache.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: .scrape-state
          key: scrape-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scrape-state-

      # Clock and cached state only. No network, so a dropped tick costs the blog
      # nothing. Skipped for a manual run, which is a request to go and look now.
      - id: cadence
        run: |
          mkdir -p .scrape-state
          python3 - <<'PY'
          import sys, json, pathlib, os
          from datetime import datetime, timezone
          sys.path.insert(0, 'scraper')
          from cadence import decide
          state_path = pathlib.Path('.scrape-state/state.json')
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          go, rate = ((decide(state, datetime.now(timezone.utc)))
                      if os.environ['EVENT'] == 'schedule' else (True, 'manual'))
          line = (f"Cadence **{rate}** — " + ("checking for new coverage."
                  if go else f"last check {state.get('last_check', 'never')}, "
                             "skipping this tick."))
          print(line)                                   # the log
          for name, text in (('GITHUB_STEP_SUMMARY', line + "\n"),
                             ('GITHUB_OUTPUT', f"check={'yes' if go else 'no'}\nrate={rate}\n")):
              with open(os.environ[name], 'a') as fh:
                  fh.write(text)
          PY
        env:
          EVENT: ${{ github.event_name }}

      # Two small requests. Stops here on most of the ticks that get this far.
      - id: gate
        if: steps.cadence.outputs.check == 'yes'
        run: |
          python3 - <<'PY'
          import sys, json, pathlib
          from datetime import datetime, timezone
          sys.path.insert(0, 'scraper')
          from fetch import Fetcher, check_for_updates
          from cadence import record
          state_path = pathlib.Path('.scrape-state/state.json')
          before = json.loads(state_path.read_text()) if state_path.exists() else {}
          f = Fetcher(cache_dir='.scrape-state/cache')
          changed, high = check_for_updates(f, state_path)
          # A backfill asks for events the archive is missing, which has nothing
          # to do with whether the blog has posted since the last run. Asked for
          # one without this, the gate answers "Nothing new since the last run.
          # Stopping." -- which is true, and not the question.
          backfill = int("${{ inputs.backfill || 0 }}" or 0)
          rebuild = int("${{ inputs.rebuild || 0 }}" or 0)
          forced = "${{ inputs.force }}" == "true" or backfill > 0 or rebuild > 0
          print(f"high-water mark: {high}  changed: {changed}  "
                f"forced: {forced}  backfill: {backfill}  rebuild: {rebuild}")
          pathlib.Path('gate.txt').write_text('yes' if (changed or forced) else 'no')
          state_path.write_text(
              json.dumps(record(before, datetime.now(timezone.utc), high), indent=2) + "\n")
          PY
          echo "run=$(cat gate.txt)" >> "$GITHUB_OUTPUT"

      - if: steps.cadence.outputs.check == 'yes' && steps.gate.outputs.run == 'no'
        run: echo "Nothing new since the last run. Stopping." >> "$GITHUB_STEP_SUMMARY"

      - if: steps.gate.outputs.run == 'yes'
        name: Scrape the newest event
        run: |
          python3 scraper/run.py --feed scraped-feed.xml \
                                 --backfill "${{ inputs.backfill || 0 }}" \
                                 --rebuild "${{ inputs.rebuild || 0 }}" \
                                 --summary "$GITHUB_STEP_SUMMARY"

      # Validated with the same checker the site's own data must pass, so a
      # scrape that could not produce usable data fails here rather than later.
      # Every event in the archive, not only the newest. A backfill writes
      # several, and an older one built from patchier coverage is exactly where
      # a bad file would come from.
      - if: steps.gate.outputs.run == 'yes'
        name: Validate the scraped data
        run: |
          python3 .github/scripts/check-feed.py scraped-feed.xml
          for f in events/*/rounds.json; do
            python3 .github/scripts/check-rounds.py "$f"
          done

      - if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: scraped-rounds
          path: |
            scraped-feed.xml
            events.json
            events
          retention-days: 14

      # Publish. Only when the bytes actually differ: the gate opens whenever the
      # sitemap moves, which includes posts this scraper does not read, and an
      # empty commit every ten minutes during an event would bury the history it
      # exists to provide -- and trigger a deploy that changes nothing.
      - if: steps.gate.outputs.run == 'yes'
        id: publish
        run: |
          cp scraped-feed.xml feed.xml
          if git diff --quiet -- feed.xml events.json events \
             && [ -z "$(git status --porcelain -- events events.json)" ]; then
            echo "No change to the published data." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "published=yes" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml events.json events
          git commit -m "Publish coverage of $(python3 -c "
          import json; print(json.load(open('events.json'))['events'][0]['event'])
          ")"
          # Rebase rather than force: a code merge may have landed since checkout,
          # and losing it to a data push would be a bad trade.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "Published to main." >> "$GITHUB_STEP_SUMMARY"

      # Only when the check actually ran, so dropped ticks leave no trace. The
      # key is unique per attempt because a cache entry cannot be overwritten;
      # the restore-key prefix picks the newest of them on the next run.
      - if: always() && steps.cadence.outputs.check == 'yes'
        uses: actions/cache/save@v6
        with:
          path: .scrape-state
          key: scrape-state-${{ github.run_id }}-${{ github.run_attempt }}

  # The push above cannot deploy itself: GitHub does not start workflows for
  # pushes made with GITHUB_TOKEN. So the deploy is called directly, against main
  # rather than the checked-out sha, because the commit landed after this run
  # began.
  deploy:
    name: Deploy the published coverage
    needs: scrape
    if: needs.scrape.outputs.published == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
